name: FilmTrack
description: FilmTrack is a cloud-based content and rights management platform for the media and
  entertainment industry, streamlining the intellectual property lifecycle from project inception
  through distribution. Its software gives distributors and studios a holistic view of the data
  behind rights, availabilities, contracts, invoicing, licensing, revenue recognition, royalties,
  and workflow management. Founded in 1996 by Jason Kassin and headquartered in Studio City,
  California, FilmTrack was acquired by City National Bank in 2019 and now operates alongside
  Rightsline. Its API-first architecture enables integration with ERP and financial systems such
  as SAP and NetSuite, and an event bus for change-driven automation. Customers include Lionsgate,
  Miramax, Focus Features, Starz, and Screen Australia.
